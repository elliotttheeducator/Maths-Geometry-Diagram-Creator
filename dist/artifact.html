// trio -- arc = radius x angle-in-radians -- so only two are ever independent.
// Typing any one of them solves for the geometry and the third updates to match,
// which is exactly the relationship these questions are usually testing.
class Circle {
  constructor({ center, radiusPx = 130, mode = "circle", startAngleDeg = -60, sweepDeg = 90, id } = {}) {
    this.id = id || nextId("circle");
    this.type = "circle";
    this.center = center || { x: 500, y: 350 };
    this.radiusPx = radiusPx;
    this.mode = mode; // "circle" | "sector" | "arc"
    this.startAngleDeg = startAngleDeg;
    this.sweepDeg = clamp(sweepDeg, 1, 359);
    this.fillId = "blue";
    this.showRadius = true;
    this.radiusIsDiameter = false;
    this.overrides = {}; // radius | angle | arc -> "" (hidden) or custom label
    this.selected = false;
    this.group = null;
    this.controller = null;
  }

  radiusUnits() {
    return this.radiusPx / PX_PER_UNIT;
  }

  arcLengthUnits() {
    return this.radiusUnits() * this.sweepDeg * DEG;
  }

  circumferenceUnits() {
    return 2 * Math.PI * this.radiusUnits();
  }

  pointAt(deg) {
    return {
      x: this.center.x + this.radiusPx * Math.cos(deg * DEG),
      y: this.center.y + this.radiusPx * Math.sin(deg * DEG),
    };
  }

  // --- editing -----------------------------------------------------------

  setRadius(units) {
    this.radiusPx = Math.max(10, units * PX_PER_UNIT);
    this.notifyChange();
  }

  setSweep(deg) {
    this.sweepDeg = clamp(deg, 1, 359);
    this.notifyChange();
  }

  // Solve the trio the other way: hold the radius, and pick the angle that gives
  // this arc length.
  setArcLength(units) {
    const r = this.radiusUnits();
    if (r < 0.01) return;
    this.sweepDeg = clamp((units / r) / DEG, 1, 359);
    this.notifyChange();
  }

  translate(dx, dy) {
    this.center = { x: this.center.x + dx, y: this.center.y + dy };

  }

  // Centre, the four cardinal points, and (for a sector) the two arc ends -- enough
  // to butt a semicircle onto a rectangle, which is the usual composite.

    const pts = [this.center, ...[0, 90, 180, 270].map((d) => this.pointAt(d))];
    if (this.mode !== "circle") pts.push(this.pointAt(this.startAngleDeg), this.pointAt(this.startAngleDeg + this.sweepDeg));
    return pts;
  }

  notifyChange() {
    this.render();
    if (this.controller?.onChange) this.controller.onChange(this);
  }

  // --- sidebar -----------------------------------------------------------

  getFields() {
    const fields = [
      {
        key: "mode-circle",
        group: "Shape",
        label: "Full circle",
        kind: "toggle",
        value: this.mode === "circle",
      },
      { key: "mode-sector", group: "Shape", label: "Sector", kind: "toggle", value: this.mode === "sector" },
      { key: "mode-arc", group: "Shape", label: "Arc only", kind: "toggle", value: this.mode === "arc" },
    ];

    const radiusOverride = this.overrides.radius;
    fields.push({
      key: "radius",
      group: "Measurements",
      label: this.radiusIsDiameter ? "Diameter" : "Radius",
      kind: "length",
      value:
        radiusOverride !== undefined
          ? radiusOverride
          : round1(this.radiusIsDiameter ? this.radiusUnits() * 2 : this.radiusUnits()),
    });
    fields.push({
      key: "as-diameter",
      group: "Measurements",
      label: "Show as diameter",
      kind: "toggle",
      value: this.radiusIsDiameter,
    });
    fields.push({
      key: "show-radius",
      group: "Measurements",
      label: "Show radius line",
      kind: "toggle",
      value: this.showRadius,
    });

    if (this.mode === "circle") {
      fields.push({
        key: "circumference",
        group: "Measurements",
        label: "Circumference",
        kind: "length",
        readOnly: true,
        value: round1(this.circumferenceUnits()),
      });
    } else {
      const angleOverride = this.overrides.angle;
      fields.push({
        key: "angle",
        group: "Measurements",
        label: "Angle",
        kind: "angle",
        value: angleOverride !== undefined ? angleOverride : round1(this.sweepDeg),
      });
      const arcOverride = this.overrides.arc;
      fields.push({
        key: "arc",
        group: "Measurements",
        label: "Arc length",
        kind: "length",
        value: arcOverride !== undefined ? arcOverride : round1(this.arcLengthUnits()),
      });

    fields.push({ key: "fill", group: "Appearance", label: "Fill", kind: "swatch", value: this.fillId });

  setField(key, value) {

      this.notifyChange();
      return;
    }
    if (key === "as-diameter") {
      this.radiusIsDiameter = Boolean(value);
      this.notifyChange();
      return;
    }
    if (key === "show-radius") {
      this.showRadius = Boolean(value);
      this.notifyChange();
      return;

    if (key === "fill") {
      this.fillId = value;
      this.notifyChange();
      return;

    if (key === "circumference") return; // derived, display only

    const target = key === "radius" ? "radius" : key === "angle" ? "angle" : "arc";

      this.notifyChange();

    if (parsed.label !== undefined) {

      return;

  extentPx() {

  render() {
    if (!this.group) return;
    clear(this.group);
    applyLabelScale(this.group, this.extentPx());
    const fill = paletteEntry(this.fillId).fill;
    const cls = `shape-poly${this.selected ? " selected" : ""}`;
    const start = this.pointAt(this.startAngleDeg);
    const end = this.pointAt(this.startAngleDeg + this.sweepDeg);
    const largeArc = this.sweepDeg > 180 ? 1 : 0;

    if (this.mode === "circle") {
      const c = el("circle", { cx: this.center.x, cy: this.center.y, r: this.radiusPx, class: cls, fill });

    } else if (this.mode === "sector") {
      const d = `M ${this.center.x} ${this.center.y} L ${start.x} ${start.y} A ${this.radiusPx} ${this.radiusPx} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;

      p.addEventListener("pointerdown", (e) => this.onBodyPointerDown(e));
      this.group.appendChild(p);

      const d = `M ${start.x} ${start.y} A ${this.radiusPx} ${this.radiusPx} 0 ${largeArc} 1 ${end.x} ${end.y}`;

    );

      renderRemovableLabel({
        x: lp.x,
        y: lp.y,
        value: displayValue,
        hidden,
        cssClass: "angle-label",
        onRemove: () => this.setField("angle", ""),
        onRestore: (e) => this.startInlineEdit(e, "angle", round1(this.sweepDeg)),
        onDoubleClick: (e) => this.startInlineEdit(e, "angle", displayValue),
      })

  renderArcLabel() {

      x: this.center.x + (this.radiusPx + arcOff) * Math.cos(bis),
      y: this.center.y + (this.radiusPx + arcOff) * Math.sin(bis),

      renderRemovableLabel({
        x: lp.x,
        y: lp.y,
        value: displayValue,
        hidden,
        cssClass: "side-label",
        onRemove: () => this.setField("arc", ""),
        onRestore: (e) => this.startInlineEdit(e, "arc", arcUnits),

      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);

    window.addEventListener("pointerup", onUp);

    if (this.controller?.onSelect) this.controller.onSelect(this);
  }

  setSelected(v) {
    this.selected = v;
    this.render();
  }

  startInlineEdit(e, fieldKey, currentValue) {
    e.stopPropagation();

// --- js/shapes/quadrilateral.js ---
const { Quadrilateral } = (function () {
const DEG = Math.PI / 180;

// Rectangle or parallelogram, held as an anchor corner plus two side vectors rather
// than four free points -- that way "rectangle" simply means the slant is 90 deg and
// stays exactly 90 through every edit, and a parallelogram's opposite sides stay
// exactly equal and parallel by construction rather than by luck.
class Quadrilateral {
  constructor({ origin, widthPx = 240, heightPx = 150, slantDeg = 90, mode = "rectangle", rotationDeg = 0, id } = {}) {
    this.id = id || nextId("quad");
    this.type = "quadrilateral";
    this.origin = origin || { x: 380, y: 420 };
    this.widthPx = widthPx;
    this.heightPx = heightPx;
    this.slantDeg = slantDeg; // angle of the second side away from the base
    this.rotationDeg = rotationDeg;
    this.mode = mode; // "rectangle" | "parallelogram"
    this.fillId = "cream";
    this.labels = ["A", "B", "C", "D"];
    this.showLabels = false;
    this.showHeight = false; // perpendicular height, the parallelogram-area cue
    // Equal-opposite-side ticks: true information, but on a plain labelled rectangle
    // it's information the shape already carries, so it can be switched off.
    this.showTicks = true;
    this.heightOutside = false; // draw the height outside the shape, off the extended base
    this.dimensionStyle = true; // arrows outside the shape rather than plain edge text
    this.overrides = {}; // base | side | height | angle -> "" hidden, or custom text
    this.selected = false;
    this.group = null;
    this.controller = null;
  }

  effectiveSlant() {
    return this.mode === "rectangle" ? 90 : this.slantDeg;
  }

  // Corners in order, with the whole shape rotated about its anchor.
  corners() {
    const slant = this.effectiveSlant() * DEG;
    const base = { x: this.widthPx, y: 0 };
    const side = { x: this.heightPx * Math.cos(-slant), y: this.heightPx * Math.sin(-slant) };
    const raw = [
      { x: 0, y: 0 },
      { x: base.x, y: base.y },
      { x: base.x + side.x, y: base.y + side.y },
      { x: side.x, y: side.y },
    ];
    return raw.map((p) => {
      const abs = { x: this.origin.x + p.x, y: this.origin.y + p.y };
      return this.rotationDeg ? rotatePoint(abs, this.origin, this.rotationDeg) : abs;
    });
  }

  baseUnits() {
    return this.widthPx / PX_PER_UNIT;
  }

  sideUnits() {
    return this.heightPx / PX_PER_UNIT;
  }

  // For a parallelogram the area uses the perpendicular height, not the slanted side.
  perpHeightUnits() {
    return this.sideUnits() * Math.sin(this.effectiveSlant() * DEG);
  }

  areaUnits() {
    return this.baseUnits() * this.perpHeightUnits();
  }

  // --- editing -----------------------------------------------------------

  setBase(units) {
    this.widthPx = Math.max(20, units * PX_PER_UNIT);
    this.notifyChange();
  }

  setSide(units) {
    this.heightPx = Math.max(20, units * PX_PER_UNIT);
    this.notifyChange();
  }

  setSlant(deg) {
    this.slantDeg = clamp(deg, 15, 165);
    this.notifyChange();
  }

  translate(dx, dy) {
    this.origin = { x: this.origin.x + dx, y: this.origin.y + dy };
    this.notifyChange();
  }

  // Corners and edge midpoints are what other shapes snap to when building a
  // composite; the outline is what "Turn into prism" extrudes.
  snapPoints() {
    const c = this.corners();
    return [...c, ...c.map((p, i) => midpoint(p, c[(i + 1) % c.length]))];
  }

  outline() {
    return this.corners();
  }

  notifyChange() {
    this.render();
    if (this.controller?.onChange) this.controller.onChange(this);
  }

  // --- sidebar -----------------------------------------------------------

  getFields() {
    const fields = [
      { key: "mode-rectangle", group: "Shape", label: "Rectangle", kind: "toggle", value: this.mode === "rectangle" },
      {
        key: "mode-parallelogram",
        group: "Shape",
        label: "Parallelogram",
        kind: "toggle",
        value: this.mode === "parallelogram",
      },
    ];

    const val = (name, computed) =>
      this.overrides[name] !== undefined ? this.overrides[name] : round1(computed);

    fields.push({ key: "base", group: "Measurements", label: "Base", kind: "length", value: val("base", this.baseUnits()) });
    fields.push({
      key: "side",
      group: "Measurements",
      label: this.mode === "rectangle" ? "Height" : "Slant side",
      kind: "length",
      value: val("side", this.sideUnits()),
    });
    if (this.mode === "parallelogram") {
      fields.push({ key: "angle", group: "Measurements", label: "Angle", kind: "angle", value: val("angle", this.slantDeg) });
      fields.push({
        key: "show-height",
        group: "Measurements",
        label: "Show perp. height",
        kind: "toggle",
        value: this.showHeight,
      });
      if (this.showHeight) {
        fields.push({
          key: "height-outside",
          group: "Measurements",
          label: "Height outside",
          kind: "toggle",
          value: this.heightOutside,
        });
      }
      if (this.showHeight) {
        fields.push({
          key: "height",
          group: "Measurements",
          label: "Perp. height",
          kind: "length",
          value: val("height", this.perpHeightUnits()),
        });
      }
    }
    fields.push({
      key: "area",
      group: "Measurements",
      label: "Area",
      kind: "length",
      readOnly: true,
      value: round1(this.areaUnits()),
    });

    fields.push({ key: "rotation", group: "Appearance", label: "Rotation", kind: "angle", value: round1(this.rotationDeg) });
    fields.push({ key: "fill", group: "Appearance", label: "Fill", kind: "swatch", value: this.fillId });
    fields.push({
      key: "dimension-style",
      group: "Appearance",
      label: "Dimension arrows",
      kind: "toggle",
      value: this.dimensionStyle,
    });
    fields.push({ key: "show-labels", group: "Appearance", label: "Corner labels", kind: "toggle", value: this.showLabels });
    fields.push({ key: "show-ticks", group: "Appearance", label: "Equal-side ticks", kind: "toggle", value: this.showTicks });
    return fields;
  }

  setField(key, value) {

      if (value) this.mode = "rectangle";
      this.notifyChange();
      return;
    }
    if (key === "mode-parallelogram") {

    }
    if (key === "fill") {
      this.fillId = value;
      this.notifyChange();
      return;
    }
    if (key === "show-labels") {
      this.showLabels = Boolean(value);
      this.notifyChange();
      return;
    }
    if (key === "show-ticks") {
      this.showTicks = Boolean(value);
      this.notifyChange();
      return;
    }
    if (key === "height-outside") {
      this.heightOutside = Boolean(value);
      this.notifyChange();
      return;
    }
    if (key === "show-height") {
      this.showHeight = Boolean(value);
      this.notifyChange();
      return;
    }
    if (key === "dimension-style") {
      this.dimensionStyle = Boolean(value);
      this.notifyChange();
      return;
    }
    if (key === "rotation") {
      this.rotationDeg = Number(value) || 0;
      this.notifyChange();
      return;
    }
    if (key === "area") return; // derived

    const parsed = parseFieldInput(value);
    if (parsed.hidden) {
      this.overrides[key] = "";
      this.notifyChange();
      return;
    }
    if (parsed.label !== undefined) {
      this.overrides[key] = parsed.label;
      this.notifyChange();
      return;
    }
    delete this.overrides[key];
    if (key === "base") this.setBase(parsed.numeric);
    else if (key === "side") this.setSide(parsed.numeric);
    else if (key === "angle") this.setSlant(parsed.numeric);

  render() {

    if (this.mode === "parallelogram") this.renderSlantAngle(pts);

        y: lp.y,

        hidden,
        cssClass: "angle-label",
        onRemove: () => this.setField("angle", ""),
        onRestore: (e) => this.startInlineEdit(e, "angle", round1(this.slantDeg)),

    }
    const labelGap =
      (this.dimensionStyle ? clearance : 0) + labelOffset(displayValue, this.extentPx(), nx, ny);
    this.group.appendChild(
      renderRemovableLabel({
        x: mid.x + nx * labelGap,
        y: mid.y + ny * labelGap,
        value: displayValue,
        hidden,
        cssClass: "side-label",
        onRemove: () => this.setField(key, ""),
        onRestore: (e) => this.startInlineEdit(e, key, computed),
        onDoubleClick: (e) => this.startInlineEdit(e, key, displayValue),
      })
    );

      const dx = p.x - c.x;
      const dy = p.y - c.y;

        text(this.labels[i], {
          x: p.x + (dx / len) * 18,

    baseHandle.addEventListener("pointerdown", (e) => this.onCornerPointerDown(e, "base"));

    window.addEventListener("pointerup", onUp);

    this.depthPx = depthPx;
    this.depthAngleDeg = depthAngleDeg;
    this.baseKind = baseKind; // rectangle | triangle | parallelogram | polygon | custom
    this.slantDeg = slantDeg;

        y: at.y + ny * off,

        hidden,
        cssClass: "side-label",
        onRemove: () => this.setField(key, ""),
        onRestore: (e) => this.startInlineEdit(e, key, computed),

    );

      hh.addEventListener("pointerdown", (e) => this.onSizePointerDown(e, "height"));
      this.group.appendChild(hh);
    }
    let far = front[0];
    for (const p of front) if (p.x > far.x) far = p;
    const idx = front.indexOf(far);
    const dh = el("circle", { cx: back[idx].x, cy: back[idx].y, r: 6, class: "drag-handle" });

    const startOrigin = { ...this.origin };

      const cur = toSvgPoint(svg, ev.clientX, ev.clientY);
      this.origin = { x: startOrigin.x + (cur.x - start.x), y: startOrigin.y + (cur.y - start.y) };
      const nudge = this.controller?.snapNudge?.(this);
      if (nudge) this.origin = { x: this.origin.x + nudge.dx, y: this.origin.y + nudge.dy };
      this.render();

    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (this.controller?.onChange) this.controller.onChange(this);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }

  onSizePointerDown(e, which) {
    e.stopPropagation();
    this.select();
    const svg = this.group.ownerSVGElement;
    const onMove = (ev) => {
      const cur = toSvgPoint(svg, ev.clientX, ev.clientY);
      if (which === "width") {
        this.widthPx = Math.max(20, cur.x - this.origin.x);
        delete this.overrides.width;
      } else if (which === "height") {
        this.heightPx = Math.max(20, this.origin.y - cur.y);
        delete this.overrides.height;

    window.addEventListener("pointerup", onUp);
  }

  select() {
    if (this.controller?.onSelect) this.controller.onSelect(this);
  }

  setSelected(v) {
    this.selected = v;
    this.render();
  }

  startInlineEdit(e, fieldKey, currentValue) {
    e.stopPropagation();
    if (this.controller?.onInlineEdit) this.controller.onInlineEdit(this, fieldKey, currentValue, e);
  }
}

        onRestore: (e) => this.startInlineEdit(e, "side", computed),
        onDoubleClick: (e) => this.startInlineEdit(e, "side", displayValue),
      })
    );
  }

  renderVertexLabels(pts) {
    pts.forEach((p, i) => {
      const dx = p.x - this.center.x;
      const dy = p.y - this.center.y;
      const len = Math.hypot(dx, dy) || 1;
      this.group.appendChild(
        text(VERTEX_NAMES[i] || `P${i + 1}`, {
          x: p.x + (dx / len) * 18,
          y: p.y + (dy / len) * 18,
          class: "vertex-label",
          "text-anchor": "middle",
          "dominant-baseline": "middle",
        })
      );
    });
  }

  renderHandles(pts) {
    // One handle on the first vertex: dragging it sizes and spins the polygon.
    const h = el("circle", { cx: pts[0].x, cy: pts[0].y, r: 6, class: "vertex-handle" });
    h.addEventListener("pointerdown", (e) => this.onVertexPointerDown(e));

  onBodyPointerDown(e) {
    e.stopPropagation();

      const cur = toSvgPoint(svg, ev.clientX, ev.clientY);

      if (nudge) this.center = { x: this.center.x + nudge.dx, y: this.center.y + nudge.dy };
      this.render();
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (this.controller?.onChange) this.controller.onChange(this);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }

  onVertexPointerDown(e) {
    e.stopPropagation();
    this.select();
    const svg = this.group.ownerSVGElement;
    const baseAngle = 90 + 180 / this.sides;
    const onMove = (ev) => {
      const cur = toSvgPoint(svg, ev.clientX, ev.clientY);
      const dx = cur.x - this.center.x;
      const dy = cur.y - this.center.y;

    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (this.controller?.onChange) this.controller.onChange(this);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }

  select() {
    if (this.controller?.onSelect) this.controller.onSelect(this);
  }

  setSelected(v) {
    this.selected = v;
    this.render();
  }

  startInlineEdit(e, fieldKey, currentValue) {
    e.stopPropagation();
    if (this.controller?.onInlineEdit) this.controller.onInlineEdit(this, fieldKey, currentValue, e);
  }

function unitTo(from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const len = Math.hypot(dx, dy) || 1;

// --- js/zip.js ---
const { makeZip } = (function () {
// A minimal ZIP writer, so a whole worksheet's diagrams can be handed over as one
// file instead of one save prompt per image. Entries are STORED (no compression):
// PNGs are already compressed, so deflating them would cost a dependency and save
// nothing. Enough of the format to be read by Windows, macOS and every unzip tool:
// a local header per file, a central directory, and an end-of-central-directory record.

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// MS-DOS packed date/time, which is what the format stores.
function dosDateTime(date) {
  const time = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
  const day = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
  return { time, day };
}

// files: [{ name, data: Uint8Array }] -> Blob
function makeZip(files, when = new Date()) {
  const { time, day } = dosDateTime(when);
  const encoder = new TextEncoder();
  const locals = [];
  const centrals = [];
  let offset = 0;

  for (const file of files) {
    const nameBytes = encoder.encode(file.name);
    const data = file.data;
    const crc = crc32(data);

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true); // version needed
    lv.setUint16(6, 0, true); // flags
    lv.setUint16(8, 0, true); // method: stored
    lv.setUint16(10, time, true);
    lv.setUint16(12, day, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true); // extra length
    local.set(nameBytes, 30);
    locals.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); // version made by
    cv.setUint16(6, 20, true); // version needed
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, time, true);
    cv.setUint16(14, day, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true); // extra
    cv.setUint16(32, 0, true); // comment
    cv.setUint16(34, 0, true); // disk number
    cv.setUint16(36, 0, true); // internal attrs
    cv.setUint32(38, 0, true); // external attrs
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centrals.push(central);

    offset += local.length + data.length;
  }

  const centralSize = centrals.reduce((sum, c) => sum + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...locals, ...centrals, end], { type: "application/zip" });
}
return { makeZip };
})();

// --- js/spec.js ---
const { parseSpec, buildDiagram, describeFields, describeGrammar, SHAPE_KEYS, shapeToSpecLine, diagramToSpec } = (function () {
// A tiny written format for diagrams, so a diagram can be asked for in one line
// instead of built by hand:
//
//   triangle a=80 b=80 ab=6 fill=cream
//   ---
//   prism base=poly n=6 side=2 depth=5 hidden
//
// Every key maps onto a real sidebar field, and the shape is driven through the same
// setField() calls the sidebar makes -- so a spec'd diagram goes through exactly the
// same solver, locks and honesty checks as a hand-built one, and can be picked up and
// edited afterwards. `---` on its own line starts a new diagram.

const ORIGIN = { x: 300, y: 480 }; // where path coordinates put (0,0)

function parseSpec(text) {
  const diagrams = [[]];
  const globals = []; // directives (units) apply to every diagram, wherever they appear
  lastInlineUnit = null;
  for (const rawLine of String(text).split(/\r?\n/)) {
    const line = rawLine.replace(/\s+#.*$/, "").trim();
    if (!line || line.startsWith("#")) continue;
    if (/^-{3,}$/.test(line)) {
      diagrams.push([]);
      continue;
    }
    const item = parseLine(line);
    if (item.type === "units") globals.push(item);
    else diagrams[diagrams.length - 1].push(item);
  }
  // Writing "12cm" anywhere states the unit for the whole spec, unless a `units` line
  // already did. Saying nothing leaves whatever the page is set to, so a spec never
  // silently strips the unit a teacher chose from the toolbar.
  if (!globals.length && lastInlineUnit) {
    globals.push({ type: "units", args: [["unit", lastInlineUnit]], points: [], raw: "" });
  }
  return diagrams.filter((d) => d.length > 0).map((d) => [...globals, ...d]);
}

function parseLine(line) {
  const tokens = line.split(/\s+/);
  const type = tokens.shift().toLowerCase();
  const args = [];
  const points = [];
  for (const tok of tokens) {
    const eq = tok.indexOf("=");
    if (eq > 0) {
      args.push([tok.slice(0, eq).toLowerCase(), stripUnitSuffix(tok.slice(eq + 1))]);
    } else if (/^-?[\d.]+,-?[\d.]+$/.test(tok)) {
      const [x, y] = tok.split(",").map(Number);
      points.push({ x, y });
    } else {
      args.push([tok.toLowerCase(), true]); // bare word = flag
    }
  }
  // `units cm` reads more naturally than `units=cm`, so accept the bare form.
  if (type === "units" && args.length && args[0][1] === true) return { type, args: [["unit", args[0][0]]], points, raw: line };
  return { type, args, points, raw: line };
}

// "12cm" both means 12 and says what unit the diagram is in -- writing the unit next
// to a measurement is what somebody transcribing a question naturally does, so it's
// taken as the answer to both questions rather than treated as an error.
function stripUnitSuffix(value) {
  const m = /^(-?\d*\.?\d+)\s*(mm|cm|m|km|in|ft)$/i.exec(String(value));
  if (!m) return value;
  lastInlineUnit = m[2].toLowerCase();
  return m[1];
}

let lastInlineUnit = null;

function isTruthyWord(value) {
  return !["off", "no", "false", "0", ""].includes(String(value).toLowerCase());
}

// Builds one diagram's shapes. Unknown keys are collected rather than thrown, so a
// nearly-right spec still draws something and says what it ignored.
function buildDiagram(items) {
  const shapes = [];
  const warnings = [];
  for (const item of items) {
    try {
      if (item.type === "units") {
        const unit = item.args.find(([k]) => k === "unit");
        setLengthUnit(unit ? String(unit[1]) : "");
        if (unit && lengthUnit() !== String(unit[1])) {
          warnings.push(`Unknown unit "${unit[1]}" -- use ${UNIT_CHOICES.filter(Boolean).join(", ")}`);
        }
        continue;
      }
      // `set` is the way past this vocabulary: it addresses any field the sidebar has,
      // on the shape written above it, so an unusual diagram never needs new syntax.
      if (item.type === "set") {
        const target = shapes[shapes.length - 1];
        if (!target) {
          warnings.push("set has no shape above it to apply to");
          continue;
        }
        for (const [key, value] of item.args) {
          const field = target.getFields().find((f) => f.key === key);
          if (!field) {
            warnings.push(`"${key}" isn't a field of this ${target.type} -- ask for ?fields to list them`);
            continue;
          }
          // On a switch, "off"/"no"/"false"/"0" has to mean off: Boolean("off") is true,
          // which would turn on exactly what was being turned off.
          if (field.kind === "toggle") target.setField(key, value === true ? true : isTruthyWord(value));
          else target.setField(key, value);
        }
        continue;
      }
      const shape = buildShape(item, warnings);
      if (shape) shapes.push(shape);
      else warnings.push(`Unknown shape "${item.type}" -- ${SHAPE_LIST}`);
    } catch (err) {
      warnings.push(`${item.raw} -- ${err.message}`);
    }
  }
  return { shapes, warnings };
}

// What a shape can be asked for right now, straight from the shape itself -- so a
// writer wanting something unusual can see the real field keys instead of reading the
// source, and the list can never drift from what the sidebar actually offers.
function describeFields(shape) {
  const groups = new Map();
  for (const field of shape.getFields()) {
    if (field.kind === "info") continue;
    if (!groups.has(field.group)) groups.set(field.group, []);
    const kind = field.readOnly ? "read-only" : field.kind;
    groups.get(field.group).push(`${field.key} (${kind})`);
  }
  const lines = [`# fields of this ${shape.type} -- use them as: set <key>=<value>`];
  for (const [group, keys] of groups) lines.push(`${group}: ${keys.join(", ")}`);
  return lines.join("\n");
}

// The whole vocabulary, generated from the registry rather than written out twice.
function describeGrammar() {
  const lines = [
    "# Diagram spec -- one shape per line, --- between diagrams, # for comments",
    "# Only what you write is labelled; everything else is drawn but left silent.",
    "",
    "units cm            set the unit every length is quoted in",
    "set <key>=<value>   change any field of the shape on the line above",
    "",
  ];
  for (const [name, entry] of Object.entries(SHAPE_KEYS)) {
    lines.push(`${name} (${entry.words.join(", ")})`);
    lines.push(`    ${entry.about}`);
    lines.push(`    keys: ${entry.keys.split(" ").join(", ")}`);
  }
  lines.push("", "fill: " + PALETTE.map((p) => p.id).join(", "));
  return lines.join("\n");
}

const SHAPE_LIST = "try triangle, rect, para, polygon, circle, sector, prism, parallel or path";

// Which words each shape understands. This is the single registry behind three things:
// suggesting a correction for a near-miss, generating the built-in "?" help, and
// telling a writer what exists -- so nobody has to read the source to find out.
const SHAPE_KEYS = {
  triangle: {
    words: ["triangle", "tri"],
    keys: "a b c ab bc ca right isosceles equilateral legs hyp base side sides height h hfrom labels ext ticks seg fill",
    about: "angles a/b/c, sides ab/bc/ca; or right/isosceles/equilateral with legs=/hyp=/base=/side=; height[=4] draws the perpendicular height (hfrom=B picks the vertex)",
  },
  rect: {
    words: ["rect", "rectangle", "square"],
    keys: "w h width height base side rot rotation ticks labels arrows fill",
    about: "w= and h=",
  },
  para: {
    words: ["para", "parallelogram"],
    keys: "w h width height outside base side angle rot rotation ticks labels arrows fill",
    about: "w= h= angle=, height[=4] to draw the perpendicular height, outside to draw it off the extended base",
  },
  polygon: {
    words: ["polygon", "pentagon", "hexagon", "octagon"],
    keys: "n sides side r radius rot rotation labels mark angle ticks fill",
    about: "n= sides and side= length (pentagon/hexagon/octagon preset n)",
  },
  circle: {
    words: ["circle", "sector", "arc"],
    keys: "r radius d diameter angle arc fill",
    about: "r=, plus angle= for a sector or arc",
  },
  prism: {
    words: ["prism"],
    keys: "base w h width height depth d angle n sides side r radius da view hidden fill",
    about: "base=rect|tri|para|poly with w= h= depth=",
  },
  parallel: {
    words: ["parallel", "lines"],
    keys: "angle angle2 dir direction gap lines transversals trans show x unknown",
    about: "angle= for the transversal; show=/x= address crossings as L1a..L2d",
  },
  path: {
    words: ["path", "shape"],
    keys: "close closed fill angles marks",
    about: "x,y points (y upwards) then close",
  },
};

const WORD_TO_SHAPE = new Map();
for (const [shape, entry] of Object.entries(SHAPE_KEYS)) {
  for (const word of entry.words) WORD_TO_SHAPE.set(word, shape);
}

// Levenshtein distance, used only to turn a near-miss into a suggestion.
function editDistance(a, b) {
  const rows = a.length + 1;
  const cols = b.length + 1;
  let prev = Array.from({ length: cols }, (_, j) => j);
  for (let i = 1; i < rows; i++) {
    const row = [i];
    for (let j = 1; j < cols; j++) {
      row[j] = Math.min(
        prev[j] + 1,
        row[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
    prev = row;
  }
  return prev[cols - 1];
}

function nearest(word, candidates) {
  let best = null;
  let bestDist = Infinity;
  for (const candidate of candidates) {
    const d = editDistance(word, candidate);
    if (d < bestDist) {
      bestDist = d;
      best = candidate;
    }
  }
  // One edit for short words, two for longer ones: close enough to be a typo rather
  // than a different word entirely.
  const limit = word.length <= 4 ? 1 : 2;
  return bestDist <= limit ? best : null;
}

// The tool corrects what it can recognise and says so, instead of ignoring the line
// and leaving the writer to guess which word was wrong.
function correctArgs(shapeName, args, warn) {
  const known = SHAPE_KEYS[shapeName].keys.split(" ");
  return args.map(([key, value]) => {
    if (known.includes(key)) return [key, value];
    const guess = nearest(key, known);
    if (guess) {
      warn(`Read "${key}" as "${guess}" on ${shapeName}`);
      return [guess, value];
    }
    return [key, value];
  });
}

// Every measurement a shape can print next to itself. A spec'd diagram labels only
// the ones the spec actually mentions and stays silent about the rest -- because a
// diagram that labels everything answers its own question, and only the person
// writing the question knows which number is the given and which is the answer.
// (Everything stays there to be switched back on: a hidden label leaves a small plus.)
const LABEL_KEYS = {
  triangle: ["angle-0", "angle-1", "angle-2", "side-0", "side-1", "side-2", "height"],
  quadrilateral: ["base", "side", "angle", "height"],
  polygon: ["side"],
  circle: ["radius", "angle", "arc"],
  prism: ["width", "height", "depth", "side"],
};

function buildShape(item, warnings) {
  const { points } = item;
  const warn = (message) => warnings.push(message);

  // A misspelled shape word is corrected the same way a misspelled key is.
  let type = item.type;
  let shapeName = WORD_TO_SHAPE.get(type);
  if (!shapeName) {
    const guess = nearest(type, [...WORD_TO_SHAPE.keys()]);
    if (!guess) return null;
    warn(`Read "${type}" as "${guess}"`);
    type = guess;
    shapeName = WORD_TO_SHAPE.get(guess);
  }

  const args = correctArgs(shapeName, item.args, warn);
  const note = (key) => {
    const known = SHAPE_KEYS[shapeName].keys.split(" ").join(", ");
    warnings.push(`${shapeName} doesn't have "${key}" -- it takes: ${known}`);
  };
  const mentioned = new Set();
  const mark = (...keys) => keys.forEach((k) => mentioned.add(k));

  let shape = null;
  if (type === "triangle" || type === "tri") shape = buildTriangle(args, note, mark, warn);
  else if (type === "rect" || type === "rectangle" || type === "square")
    shape = buildQuad(args, note, mark, "rectangle", type === "square");
  else if (type === "para" || type === "parallelogram") shape = buildQuad(args, note, mark, "parallelogram", false);
  else if (type === "polygon" || type === "pentagon" || type === "hexagon" || type === "octagon")
    shape = buildPolygon(type, args, note, mark);
  else if (type === "circle" || type === "sector" || type === "arc") shape = buildCircle(type, args, note, mark);
  else if (type === "prism") shape = buildPrism(args, note, mark);
  else if (type === "parallel" || type === "lines") shape = buildParallel(args, note);
  else if (type === "path" || type === "shape") shape = buildPath(points, args, note);
  if (!shape) return null;

  const labelKeys = LABEL_KEYS[shape.type];
  if (labelKeys) for (const key of labelKeys) if (!mentioned.has(key)) shape.setField(key, "");
  return shape;
}

// --- per-shape builders ---------------------------------------------------
//
// Args are applied in written order, because order is meaningful: "a=80 b=80 ab=6"
// locks two angles and then scales to the side, which is a different (and correct)
// construction from doing it the other way round.

function buildTriangle(args, note, mark, warn) {
  const t = new Triangle({});
  t.showVertexLabels = false; // letters only when the spec asks for them
  const ANGLES = { a: 0, b: 1, c: 2 };
  const SIDES = { ab: 0, bc: 1, ca: 2 };
  for (const [key, value] of args) {
    // A value the triangle refused (no such triangle exists) is reported rather than
    // quietly fudged into one that does.
    if (t.lastRefusal) {
      warn(t.lastRefusal);
      t.lastRefusal = null;
    }
    if (key in ANGLES) {
      t.setField(`angle-${ANGLES[key]}`, value);
      mark(`angle-${ANGLES[key]}`);
    } else if (key in SIDES) {
      t.setField(`side-${SIDES[key]}`, value);
      mark(`side-${SIDES[key]}`);
    } else if (key === "labels") {
      t.showVertexLabels = value !== "off";
      if (value !== true && value !== "off") splitList(value).forEach((l, i) => t.setField(`label-${i}`, l));
    } else if (key === "ext") {
      for (const which of splitList(value)) t.setField(`ext-toggle-${vertexIndex(which, t.labels)}`, true);
    } else if (key === "right") {
      // The words a question is actually phrased in. A right angle sits at A, so its
      // legs are the two sides meeting there and the hypotenuse is the one opposite.
      t.setField("angle-0", 90);
      mark("angle-0");
    } else if (key === "legs") {
      // Two values are the two sides meeting at the right angle; one value is the
      // isosceles reading, where both sides off the base are that long.
      const list = splitList(value);
      if (list.length >= 2) {
        t.setField("side-0", list[0]);
        t.setField("side-2", list[1]);
        mark("side-0", "side-2");
      } else if (list.length === 1) {
        t.setField("side-1", list[0]);
        t.setField("side-2", list[0]);
        mark("side-1", "side-2");
      }
    } else if (key === "hyp") {
      t.setField("side-1", value);
      mark("side-1");
    } else if (key === "base") {
      t.setField("side-0", value);
      mark("side-0");
    } else if (key === "equilateral") {
      for (const i of [0, 1, 2]) t.setField(`angle-${i}`, 60);
      mark("angle-0");
    } else if (key === "isosceles") {
      // On its own it says nothing measurable; it pairs with base= and side=/legs=.
      continue;
    } else if (key === "side" || key === "sides") {
      // `sides=3,4,5` gives all three at once; a single value makes it equilateral.
      const list = splitList(value);
      if (list.length >= 3) {
        list.slice(0, 3).forEach((len, i) => {
          t.setField(`side-${i}`, len);
          mark(`side-${i}`);
        });
      } else if (list.length === 2) {
        // base plus the two equal sides, the usual way an isosceles is quoted
        t.setField("side-0", list[0]);
        t.setField("side-1", list[1]);
        t.setField("side-2", list[1]);
        mark("side-0", "side-1", "side-2");
      } else if (list.length === 1) {
        [0, 1, 2].forEach((i) => {
          t.setField(`side-${i}`, list[0]);
          mark(`side-${i}`);
        });
      }
    } else if (key === "height" || key === "h") {
      // `height` draws the perpendicular height; `height=4` also sets it.
      t.setField("show-height", true);
      if (value !== true) t.setField("height", value);
      mark("height");
    } else if (key === "hfrom") {
      t.setField("show-height", true);
      t.setField(`height-from-${vertexIndex(value, t.labels)}`, true);
      mark("height");
    } else if (key === "ticks") t.setField("show-ticks", value !== "off");
    else if (key === "seg") {
      t.setField("cevian-toggle", true);
      if (value !== true) t.setField("cevian-t", value);
    } else if (key === "fill") t.setField("fill", value);
    else note(key);
  }
  if (t.lastRefusal) {
    warn(t.lastRefusal);
    t.lastRefusal = null;
  }
  return t;
}

function buildQuad(args, note, mark, mode, isSquare) {
  const q = new Quadrilateral({ mode });
  // A labelled rectangle's opposite sides are equal by definition -- ticks saying so
  // are just more ink, so they're opt-in here.
  q.showTicks = false;
  if (mode === "parallelogram") q.setField("mode-parallelogram", true);
  for (const [key, value] of args) {
    if (key === "w" || key === "width" || key === "base") {
      q.setField("base", value);
      mark("base");
    } else if (key === "h" || key === "height" || key === "side") {
      // On a parallelogram a bare `height` flag shows the perpendicular height, while
      // `height=4` sets it; on a rectangle the two are the same measurement.
      if (value === true) {
        q.setField("show-height", true);
        mark("height");
      } else if (key === "height" && mode === "parallelogram") {
        q.setField("show-height", true);
        q.setField("height", value);
        mark("height");
      } else {
        q.setField("side", value);
        mark("side");
      }
    } else if (key === "angle") {
      q.setField("angle", value);
      mark("angle");
    }
    else if (key === "rot" || key === "rotation") q.setField("rotation", value);
    else if (key === "outside") {
      q.setField("show-height", true);
      q.setField("height-outside", value !== "off");
      mark("height");
    } else if (key === "ticks") q.setField("show-ticks", value !== "off");
    else if (key === "labels") q.setField("show-labels", value !== "off");
    else if (key === "arrows") q.setField("dimension-style", value !== "off");
    else if (key === "fill") q.setField("fill", value);
    else note(key);
  }
  if (isSquare) q.setField("side", round1(q.baseUnits()));
  return q;
}

function buildPolygon(type, args, note, mark) {
  const preset = { pentagon: 5, hexagon: 6, octagon: 8 }[type];
  const p = new RegularPolygon({});
  if (preset) p.setField("sides", preset);
  for (const [key, value] of args) {
    if (key === "n" || key === "sides") p.setField("sides", value);
    else if (key === "side") {
      p.setField("side", value);
      mark("side");
    } else if (key === "r" || key === "radius") p.setField("radius", value);
    else if (key === "rot" || key === "rotation") p.setField("rotation", value);
    else if (key === "labels") p.setField("show-labels", value !== "off");
    else if (key === "mark" || key === "angle") p.setField("show-interior", value !== "off");
    else if (key === "ticks") p.setField("show-ticks", value !== "off");
    else if (key === "fill") p.setField("fill", value);
    else note(key);
  }
  return p;
}

function buildCircle(type, args, note, mark) {
  const c = new Circle({});
  if (type === "sector") c.setField("mode-sector", true);
  if (type === "arc") c.setField("mode-arc", true);
  for (const [key, value] of args) {
    if (key === "r" || key === "radius") {
      if (value === true) c.setField("show-radius", true);
      else c.setField("radius", value);
      mark("radius");
    } else if (key === "d" || key === "diameter") {
      c.setField("as-diameter", value !== "off");
      mark("radius");
    } else if (key === "angle") {
      c.setField("angle", value);
      mark("angle");
    } else if (key === "arc") {
      if (value !== true) c.setField("arc", value);
      mark("arc");
    } else if (key === "fill") c.setField("fill", value);
    else note(key);
  }
  return c;
}

const PRISM_BASES = { rect: "rectangle", rectangle: "rectangle", tri: "triangle", triangle: "triangle", para: "parallelogram", parallelogram: "parallelogram", poly: "polygon", polygon: "polygon" };

function buildPrism(args, note, mark) {
  const p = new Prism({});
  // The base has to be settled first: which measurements even exist depends on it.
  const baseArg = args.find(([k]) => k === "base");
  if (baseArg) {
    const kind = PRISM_BASES[String(baseArg[1]).toLowerCase()];
    if (!kind) throw new Error(`unknown base "${baseArg[1]}" -- use rect, tri, para or poly`);
    p.setField(`base-${kind}`, true);
  }
  for (const [key, value] of args) {
    if (key === "base") continue;
    else if (key === "w" || key === "width") {
      p.setField("width", value);
      mark("width");
    } else if (key === "h") {
      p.setField("height", value);
      mark("height");
    } else if (key === "height") {
      if (value === true) p.setField("show-apex-height", true);
      else p.setField("height", value);
      mark("height");
    } else if (key === "depth" || key === "d") {
      p.setField("depth", value);
      mark("depth");
    } else if (key === "angle") p.setField("slant", value);
    else if (key === "n" || key === "sides") p.setField("sides", value);
    else if (key === "side") {
      p.setField("side", value);
      mark("side");
    } else if (key === "r" || key === "radius") p.setField("radius", value);
    else if (key === "da" || key === "view") p.setField("depth-angle", value);
    else if (key === "hidden") p.setField("hidden-edges", value !== "off");
    else if (key === "fill") p.setField("fill", value);
    else note(key);
  }
  return p;
}

// Crossing angles are addressed as L<line><slot>, or T<transversal>L<line><slot> when
// there's more than one transversal. Slots run anticlockwise from below-right:
// a = below-right, b = below-left, c = above-left, d = above-right.
function parseAngleAddress(token) {
  const m = /^(?:t(\d+))?l(\d+)([a-d])$/i.exec(String(token).trim());
  if (!m) return null;
  const j = m[1] ? Number(m[1]) - 1 : 0;
  const k = Number(m[2]) - 1;
  const s = "abcd".indexOf(m[3].toLowerCase());
  return j >= 0 && k >= 0 ? `disp-T${j}-L${k}-${s}` : null;
}

function buildParallel(args, note) {
  const pl = new ParallelLines({});
  let show = null;
  const unknowns = [];
  for (const [key, value] of args) {
    if (key === "angle") pl.setField("trans-angle-0", value);
    else if (key === "angle2") pl.setField("trans-angle-1", value);
    else if (key === "dir" || key === "direction") pl.setField("line-angle", value);
    else if (key === "gap") pl.setField("gap", value);
    else if (key === "lines") pl.setField("add-line", Number(value) >= 3);
    else if (key === "transversals" || key === "trans") pl.setField("add-transversal", Number(value) >= 2);
    else if (key === "show") show = String(value);
    else if (key === "x" || key === "unknown") unknowns.push(...splitList(value));
    else note(key);
  }

  // Four angles at every crossing means up to 24 numbers on one diagram, which turns
  // a question into its own answer key. Only the given angle is labelled unless the
  // spec asks for more.
  const everyKey = [];
  for (let j = 0; j < pl.transversals.length; j++) {
    for (let k = 0; k < pl.lineCount; k++) {
      for (let s = 0; s < 4; s++) everyKey.push(`disp-T${j}-L${k}-${s}`);
    }
  }

  const showKeys = new Set();
  if (show === "all") everyKey.forEach((key) => showKeys.add(key));
  else if (show) {
    for (const token of splitList(show)) {
      const key = parseAngleAddress(token);
      if (key) showKeys.add(key);
      else note(`show=${token}`);
    }
  } else {
    showKeys.add("disp-T0-L0-0"); // slot a of the first crossing IS the given angle
  }

  const labelled = new Map();
  for (const token of unknowns) {
    const [addr, text] = String(token).split(":");
    const key = parseAngleAddress(addr);
    if (key) labelled.set(key, text || "x");
    else note(`x=${token}`);
  }

  for (const key of everyKey) {
    if (labelled.has(key)) pl.setField(key, labelled.get(key));
    else if (!showKeys.has(key)) pl.setField(key, "");
  }
  return pl;
}

// `path 0,0 6,0 6,3 3,3 3,5 0,5 close fill=cream` -- the irregular composite outlines
// that area questions are built from. Coordinates are in units with y pointing up,
// which is how they'd be read off a question, not screen-down.
function buildPath(points, args, note) {
  if (points.length < 2) throw new Error("path needs at least two x,y points");
  const g = new LineGraph({});
  let closed = false;
  let fill = null;
  let showAngles = false;
  let showMarks = false;
  for (const [key, value] of args) {
    if (key === "close" || key === "closed") closed = value !== "off";
    else if (key === "fill") fill = value;
    else if (key === "angles") showAngles = value !== "off";
    else if (key === "marks") showMarks = value !== "off";
    else note(key);
  }
  // On an outline every horizontal side is parallel to every other one, so the
  // chevron/tick notation fires everywhere and buries the measurements.
  g.showParallelMarks = showMarks;
  g.showEqualMarks = showMarks;
  g.buildPath(
    points.map((p) => ({ x: ORIGIN.x + p.x * PX_PER_UNIT, y: ORIGIN.y - p.y * PX_PER_UNIT })),
    { closed: closed || fill !== null }
  );
  if (fill) g.fillAllCycles(fill);
  // An outline's corners are nearly always right angles; labelling all of them buries
  // the side lengths, so they start hidden unless the spec asks for them.
  if (!showAngles) g.hideAllAngles();
  return g;
}

function splitList(value) {
  return String(value).split(/[,/]/).map((s) => s.trim()).filter(Boolean);
}

function vertexIndex(which, labels) {
  const asNumber = Number(which);
  if (Number.isFinite(asNumber)) return Math.max(0, Math.min(2, asNumber - 1));
  const found = labels.findIndex((l) => l.toLowerCase() === String(which).toLowerCase());
  return found >= 0 ? found : 0;
}

// --- the other direction: shapes back to spec text ------------------------
//
// So a diagram built by hand in the app can be copied back out as a line a chat can
// reuse or tweak, instead of being a dead end.

// Renders the flags that are switched on, so a diagram styled in the app comes back
// out looking the same rather than reset to defaults.
function flags(map) {
  const on = Object.entries(map)
    .filter(([, isOn]) => isOn)
    .map(([word]) => word);
  return on.length ? ` ${on.join(" ")}` : "";
}

function shapeToSpecLine(shape) {
  const n = (v) => round1(v);
  if (shape.type === "triangle") {
    const a = shape.angles();
    const s = shape.sides().map((px) => px / PX_PER_UNIT);
    return `triangle a=${n(a[0])} b=${n(a[1])} ab=${n(s[0])} fill=${shape.fillId}`;
  }
  if (shape.type === "quadrilateral") {
    const kind = shape.mode === "rectangle" ? "rect" : "para";
    const angle = shape.mode === "parallelogram" ? ` angle=${n(shape.slantDeg)}` : "";
    return `${kind} w=${n(shape.baseUnits())} h=${n(shape.sideUnits())}${angle}${flags({
      height: shape.showHeight,
      labels: shape.showLabels,
      "arrows=off": !shape.dimensionStyle,
    })} fill=${shape.fillId}`;
  }
  if (shape.type === "polygon") {
    return `polygon n=${shape.sides} side=${n(shape.sideUnits())}${flags({
      mark: shape.showInteriorAngle,
      labels: shape.showLabels,
      "ticks=off": !shape.showTicks,
    })} fill=${shape.fillId}`;
  }
  if (shape.type === "circle") {
    const kind = shape.mode === "circle" ? "circle" : shape.mode;
    const sweep = shape.mode === "circle" ? "" : ` angle=${n(shape.sweepDeg)}`;
    return `${kind} r=${n(shape.radiusUnits())}${sweep} fill=${shape.fillId}`;
  }
  if (shape.type === "prism") {
    const kindWord = { rectangle: "rect", triangle: "tri", parallelogram: "para", polygon: "poly", custom: "custom" }[shape.baseKind];
    if (shape.baseKind === "custom") return `# (custom-outline prism -- rebuild from its 2D shape, then "Turn into prism")`;
    const size =
      shape.baseKind === "polygon"
        ? `n=${shape.sides} side=${n(shape.baseSideUnits())}`
        : `w=${n(shape.widthUnits())} h=${n(shape.heightUnits())}`;
    const slant = shape.baseKind === "parallelogram" ? ` angle=${n(shape.slantDeg)}` : "";
    const hidden = shape.showHiddenEdges ? " hidden" : "";
    return `prism base=${kindWord} ${size}${slant} depth=${n(shape.depthUnits())}${hidden} fill=${shape.fillId}`;
  }
  if (shape.type === "parallel-lines") {
    return `parallel angle=${n(shape.transversals[0].relAngleDeg)} lines=${shape.lineCount} transversals=${shape.transversals.length}`;
  }
  if (shape.type === "line-graph") {
    // Only a single open or closed chain round-trips as a path; anything branchier is
    // still perfectly usable in the app, it just can't be written as one line.
    const chain = shape.asChain?.();
    if (!chain) return `# (freeform line diagram -- no single-path spec for this one)`;
    const pts = chain.points
      .map((p) => `${n((p.x - ORIGIN.x) / PX_PER_UNIT)},${n((ORIGIN.y - p.y) / PX_PER_UNIT)}`)
      .join(" ");
    return `path ${pts}${chain.closed ? " close" : ""}`;
  }
  return `# (${shape.type} has no spec form yet)`;
}

function diagramToSpec(shapes) {
  return shapes.map(shapeToSpecLine).join("\n");
}
return { parseSpec, buildDiagram, describeFields, describeGrammar, SHAPE_KEYS, shapeToSpecLine, diagramToSpec };
})();

// --- js/aiCard.js ---
const { AI_CARD } = (function () {
// The single source of truth for the instructions given to an AI assistant. The build
// script writes this out as AI-INSTRUCTIONS.md (to paste into a Claude Project) and as
// a SKILL.md (to upload as a Claude Skill), and the app shows it behind the "For AI"
// button so it can be copied without leaving the page.
//
// Keep it short on purpose: the whole point is that a chat loads ~700 tokens of this
// instead of ~55,000 tokens of application HTML.

const AI_CARD = `# Geometry diagram specs

A diagram tool for maths worksheets (triangles, polygons, circles, prisms, parallel
lines, composite outlines). You write ONE LINE per diagram; the tool solves the real
geometry and the teacher exports PNG/SVG straight into Word.

**Never rebuild this tool as an artifact and never fetch or read its HTML.** Writing a
spec line is all that is needed, and costs a fraction as much.

## Handing a diagram over

- If the teacher has the tool open: give them the spec lines to paste into "Spec...".
- Otherwise give them a link with the spec URL-encoded after \`#spec=\`:
  \`https://elliotttheeducator.github.io/Maths-Geometry-Diagram-Creator/#spec=triangle%20a%3D80%20b%3D80%20ab%3D6\`
  Opening it draws the diagram straight away. (Links only work on that hosted address;
  inside a Claude artifact preview, paste into the Spec box instead.)

## Say it the way the question is phrased

The tool carries the geometry; you only state what the question gives. These all work
as written, and each is a complete diagram:

\`\`\`
units cm
triangle right legs=6,8 hyp=x        # Pythagoras
triangle sides=3,4,5                 # three sides -- solved exactly
triangle isosceles base=6 legs=5
triangle equilateral side=5
triangle base=9 height=4             # area: base and perpendicular height
para w=16 h=5.5 angle=65 height=5    # height drawn inside, right-angle box at the foot
parallel angle=115 x=L2c             # co-interior angles
\`\`\`

A unit written on a measurement (\`w=12cm\`) sets the unit for the whole spec, so
\`units cm\` is only needed when no measurement carries one.

If a word is close to a real one it's read as that one and the tool says so, so a
half-remembered key still draws. If it isn't close to anything, the message lists
every key that shape takes.

## Grammar

One shape per line. \`---\` alone on a line starts a new diagram. \`#\` starts a comment.
Lengths are in units, angles in degrees. Bare words are flags; \`key=value\` sets a value.

| Shape | Keys |
|---|---|
| \`triangle\` | \`a= b= c=\` angles at vertices 1/2/3, \`ab= bc= ca=\` sides, \`height\`/\`height=4\`/\`hfrom=B\` perpendicular height, \`labels\` or \`labels=P,Q,R\` vertex letters, \`ext=A\` exterior angle, \`ticks=off\`, \`seg\` or \`seg=0.6\` internal parallel segment |
| \`rect\` | \`w= h=\`, \`labels\`, \`ticks\` equal-side marks, \`arrows=off\`, \`rot=\` |
| \`para\` | \`w= h= angle=\`, \`height\` (draw perpendicular height) or \`height=4\` (set it), \`outside\` (draw it off the extended base), \`rot=\` |
| \`polygon\` | \`n= side=\` or \`r=\`, \`mark\` (interior angle), \`labels\`, \`ticks=off\`, \`rot=\` |
| \`pentagon\` \`hexagon\` \`octagon\` | same as polygon with \`n\` preset |
| \`circle\` | \`r=\`, \`d\` (label as diameter), \`radius\` (draw the radius line) |
| \`sector\` | \`r= angle=\`, \`arc=\` (set arc length), \`radius\` |
| \`arc\` | \`r= angle=\` |
| \`prism\` | \`base=rect\\|tri\\|para\\|poly\`, \`w= h= depth=\`, \`angle=\` (para base), \`n= side=\` (poly base), \`hidden\` (hidden edges), \`height\` (perp height, tri base), \`da=\` (viewing angle) |
| \`parallel\` | \`angle=\` transversal angle, \`dir=\`, \`gap=\`, \`lines=3\`, \`transversals=2\`, \`show=\` which crossing angles to label, \`x=\` which to mark unknown |
| \`path\` | \`x,y x,y x,y ...\` then \`close\`, for composite/L-shaped outlines. y points UP. Corner angles and parallel/equal marks start hidden; add \`angles\` or \`marks\` to show them. |

Every shape also takes \`fill=\` one of \`cream green blue rose violet amber slate none\`.

## When the vocabulary above isn't enough

Two lines cover everything else, so an unusual diagram never needs new syntax and you
never need to read the tool's source:

- \`units cm\` — the unit every length is quoted in (mm, cm, m, km, in, ft).
- \`set <key>=<value>\` — changes **any** field of the shape on the line above, using the
  same field names the app's own sidebar uses. For example \`set ext-toggle-1=on\` extends
  a triangle's side to show an exterior angle.

To find those field names, ask the teacher to type \`?fields\` in the Spec box with the
shape on screen: the tool lists every field that shape has, generated from the shape
itself. \`?\` on its own prints this whole grammar. Either can be pasted back to you --
that is the intended way to discover what exists, rather than reading any code.

## What gets labelled — the rule that matters

**Only what you write is labelled.** Everything else is drawn correctly and left
silent. A diagram that labels every side and angle hands over the answer, and only the
person writing the question knows which number is the given and which is the answer, so
that decision is yours on every line.

\`\`\`
triangle a=90 b=35 ab=8       # three labels: two angles and one side
triangle a=90 ab=8            # two labels; the other angles are still exactly right
triangle a=90 b=35 ab=8 ca=x  # "find x" -- a letter labels a side without resizing it
\`\`\`

So: write the givens, write the unknown as a letter, and write nothing else. If a
measurement is wanted later, the teacher clicks the small plus where it would sit.

Two things the tool marks on its own, because they are geometry rather than pedagogy:
a right angle keeps its square, and sides that are genuinely equal get matching ticks
(\`ticks=off\` to suppress) — which is how to show "these two are equal" without
labelling either of them.

## Heights

\`height\` on a triangle or parallelogram draws the perpendicular height the textbook
way: a dashed line with a right-angle box where it meets the base. \`height=4\` also sets
it. When the foot of the perpendicular falls off the end of the base -- every obtuse
triangle, and \`outside\` on a parallelogram -- the base is extended with a dashed line
to meet it, which is exactly how it's drawn in a book. \`hfrom=B\` picks which vertex of
a triangle the height drops from.

Every construction line is dashed, because none of them is an edge of the shape: heights,
base extensions, radii and diameters all read as drawn-to-explain rather than drawn-as-part-of.

## Things worth knowing

- Two angles plus one side fully determines a triangle, and typed values lock, so
  \`triangle a=80 b=80 ab=6\` really is isosceles -- the third angle follows and stays 20.
- Anything unspecified keeps a sensible default; unknown keys are reported, not fatal.
- Every quoted number is measured off the actual drawing, so a diagram is never
  labelled with something its geometry doesn't support.
- On a \`parallel\` diagram only the given angle is labelled. Address the others as
  \`L<line><slot>\` (\`T<transversal>L<line><slot>\` with two transversals), where the
  slots run anticlockwise from below-right: \`a\` below-right, \`b\` below-left,
  \`c\` above-left, \`d\` above-right. So \`parallel angle=115 x=L2c\` gives one known
  angle and one to find; \`show=all\` labels every one.

## Examples

\`\`\`
triangle a=90 b=35 ab=8              # right-angled, 35 deg at B
triangle a=80 b=80 ab=6 fill=blue    # isosceles: equal sides get ticks, unlabelled
triangle a=90 ab=6 bc=8 ca=x         # Pythagoras: two givens and the unknown
rect w=12 h=7 fill=cream             # area / perimeter
para w=9 h=5 angle=60 height         # parallelogram with perpendicular height
polygon n=8 side=4 mark labels       # regular octagon, interior angle marked
circle r=6.5 d                       # circle labelled by its diameter
sector r=5 angle=120 arc=            # sector showing its arc length
prism base=rect w=8 h=4 depth=12 hidden
prism base=poly n=6 side=3 depth=10 hidden
parallel angle=115 x=L2c             # co-interior angles: one given, one to find
path 0,0 10,0 10,4 6,4 6,7 0,7 close fill=cream   # L-shaped composite
\`\`\`

## A whole worksheet at once

Separate diagrams with \`---\`. The tool renders them as a grid, with Copy and Save per
diagram and "Save all" for a zip of every PNG at once:

\`\`\`
rect w=10 h=6 fill=cream
---
triangle a=90 b=30 ab=7 fill=blue
---
prism base=tri w=6 h=4 depth=9 hidden
\`\`\`
`;
return { AI_CARD };
})();
